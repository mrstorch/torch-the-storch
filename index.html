<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torch the Storch</title>

<style>

:root{
    --blue:#27a5ff;
    --orange:#ff9d00;
    --gold:#ffd54f;
    --dark:#111;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at center,#333 0%,#111 60%,#000 100%);
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    text-align:center;
}

#container{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

#banner{
    width:100%;
    max-width:950px;
    border:4px solid orange;
    border-radius:12px;
    box-shadow:0 0 25px orange;
}

h1{
    margin:10px 0;
}

.controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:15px 0;
}

button,
select{
    border:none;
    border-radius:8px;
    padding:12px 20px;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

#newGame{
    background:#ff5722;
    color:white;
}

#musicBtn{
    background:#2196f3;
    color:white;
}

#status{
    margin:15px;
    min-height:32px;
    font-size:24px;
    color:gold;
    font-weight:bold;
}

#scoreBoard{
    display:flex;
    justify-content:center;
    gap:50px;
    font-size:22px;
    margin-bottom:15px;
}

.playerScore{
    color:var(--blue);
    font-weight:bold;
}

.compScore{
    color:var(--orange);
    font-weight:bold;
}

#board{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-top:15px;
}

.row{
    display:flex;
    gap:10px;
}

.cell{
    width:68px;
    height:68px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    font-size:24px;
    font-weight:bold;

    border:3px solid orange;

    background:
        radial-gradient(circle,#555,#111);

    transition:.2s;

    user-select:none;
}

.cell:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px orange;
}

.player{
    background:#07294c;
    color:var(--blue);
}

.computer{
    background:#432100;
    color:var(--orange);
}

.blackhole{
    background:black;
    color:red;
    border-color:red;
    animation:pulse .9s infinite;
}

.destroyed{
    opacity:.20;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.18);
    }

    100%{
        transform:scale(1);
    }
}

#result{
    margin-top:20px;
    min-height:40px;
    font-size:30px;
    font-weight:bold;
}

#confetti{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.piece{
    position:absolute;
    width:10px;
    height:10px;
    animation:fall 3s linear forwards;
}

@keyframes fall{

    from{
        transform:
            translateY(-40px)
            rotate(0deg);
    }

    to{
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}

.instructions{
    max-width:900px;
    margin:20px auto;
    text-align:left;
    background:rgba(255,255,255,.08);
    padding:15px;
    border-radius:10px;
}

.instructions li{
    margin:8px 0;
}

@media(max-width:700px){

    .cell{

        width:50px;
        height:50px;
        font-size:18px;
    }

    #scoreBoard{

        flex-direction:column;
        gap:10px;
    }
}

</style>
</head>

<body>

<div id="confetti"></div>

<div id="container">

<img
    id="banner"
    src="banner.png"
    alt="Torch the Storch">

<h1>🔥 TORCH THE STORCH 🔥</h1>

<div class="controls">

<button id="newGame">
New Game
</button>

<button id="musicBtn">
▶ Music
</button>

<select id="difficulty">

<option value="easy">
Easy
</option>

<option value="medium">
Medium
</option>

<option value="hard">
Hard
</option>

<option value="torch">
Torch Mode
</option>

</select>

</div>

<div id="status">
Press New Game
</div>

<div id="scoreBoard">

<div class="playerScore">
Player:
<span id="playerScore">
0
</span>
</div>

<div class="compScore">
Computer:
<span id="computerScore">
0
</span>
</div>

</div>

<div id="board"></div>

<div id="result"></div>

<div class="instructions">

<ol>
<li>Take turns choosing spaces.</li>
<li>Numbers 1–20 are placed automatically.</li>
<li>The final open space becomes the Black Hole.</li>
<li>Adjacent numbers are destroyed.</li>
<li>Highest remaining score wins.</li>
</ol>

</div>

<audio
    id="bgMusic"
    src="Torch-the-Storch.mp3"
    preload="auto">
</audio>

<script>

const GAME={

    spaces:{},

    currentNumber:1,

    gameActive:false,

    playerTurn:true,

    difficulty:"easy",

    playerScore:0,

    computerScore:0
};

const board =
    document.getElementById("board");

const statusText =
    document.getElementById("status");

const result =
    document.getElementById("result");

const playerScoreSpan =
    document.getElementById("playerScore");

const computerScoreSpan =
    document.getElementById("computerScore");

const music =
    document.getElementById("bgMusic");

const rows=[1,2,3,4,5,6];

const adjacency={

1:[2,3],

2:[1,3,4,5],
3:[1,2,5,6],

4:[2,5,7,8],
5:[2,3,4,6,8,9],
6:[3,5,9,10],

7:[4,8,11,12],
8:[4,5,7,9,12,13],
9:[5,6,8,10,13,14],
10:[6,9,14,15],

11:[7,12,16,17],
12:[7,8,11,13,17,18],
13:[8,9,12,14,18,19],
14:[9,10,13,15,19,20],
15:[10,14,20,21],

16:[11,17],
17:[11,12,16,18],
18:[12,13,17,19],
19:[13,14,18,20],
20:[14,15,19,21],
21:[15,20]

};

function createBoard(){

    board.innerHTML="";

    GAME.spaces={};

    let id=1;

    for(let r=0;r<rows.length;r++){

        const row =
            document.createElement("div");

        row.className="row";

        for(let c=0;c<rows[r];c++){

            const cell =
                document.createElement("div");

            cell.className="cell";

            const currentId=id;

            GAME.spaces[currentId]={

                id:currentId,

                owner:null,

                number:null,

                cell:cell
            };

            cell.addEventListener(
                "click",
                ()=>playerMove(currentId)
            );

            row.appendChild(cell);

            id++;
        }

        board.appendChild(row);
    }
}

   function startGame(){

    createBoard();

    GAME.currentNumber=1;

    GAME.playerScore=0;
    GAME.computerScore=0;

    GAME.gameActive=true;

    GAME.difficulty=
        document.getElementById("difficulty").value;

    result.textContent="";

    playerScoreSpan.textContent="0";
    computerScoreSpan.textContent="0";

    GAME.playerTurn=Math.random()<0.5;

    statusText.textContent=
        GAME.playerTurn
        ? "Your Turn!"
        : "Computer Starts!";

    music.pause();
    music.currentTime=0;

    music.play().catch(()=>{});

    if(!GAME.playerTurn){

        setTimeout(
            computerMove,
            900
        );
    }
}

function emptySpaces(){

    const list=[];

    for(let i=1;i<=21;i++){

        if(
            !GAME.spaces[i].owner
        ){
            list.push(i);
        }
    }

    return list;
}

function playerMove(id){

    if(!GAME.gameActive) return;

    if(!GAME.playerTurn) return;

    const space=
        GAME.spaces[id];

    if(!space) return;

    if(space.owner) return;

    claimSpace(
        id,
        "player"
    );
}

function claimSpace(
    id,
    owner
){

    const space=
        GAME.spaces[id];

    space.owner=owner;

    space.number=
        GAME.currentNumber;

    space.cell.textContent=
        GAME.currentNumber;

    space.cell.classList.add(
        owner
    );

    playMoveSound();

    GAME.currentNumber++;

    if(
        GAME.currentNumber>20
    ){
        finishGame();
        return;
    }

    GAME.playerTurn=
        !GAME.playerTurn;

    statusText.textContent=
        GAME.playerTurn
        ? "Your Turn!"
        : "Computer Thinking...";

    if(
        !GAME.playerTurn
    ){

        const thinkTime=
            700+
            Math.random()*600;

        setTimeout(
            computerMove,
            thinkTime
        );
    }
}

function computerMove(){

    if(
        !GAME.gameActive
    ) return;

    let move;

    switch(
        GAME.difficulty
    ){

        case "medium":

            move=
            mediumMove();

            break;

        case "hard":

            move=
            hardMove();

            break;

        case "torch":

            move=
            torchMove();

            break;

        default:

            move=
            easyMove();
    }

    claimSpace(
        move,
        "computer"
    );
}


/* EASY AI */

function easyMove(){

    const open=
        emptySpaces();

    return open[
        Math.floor(
            Math.random()*
            open.length
        )
    ];
}


/* MEDIUM AI */

function mediumMove(){

    const open=
        emptySpaces();

    let best=open[0];
    let bestScore=-999;

    for(
        const spot
        of open
    ){

        const score=
            adjacency[spot]
            .length;

        if(
            score>
            bestScore
        ){

            best=spot;
            bestScore=score;
        }
    }

    return best;
}


/* HARD AI */

function hardMove(){

    const open=
        emptySpaces();

    let best=open[0];
    let bestScore=-99999;

    for(
        const spot
        of open
    ){

        let score=0;

        score+=
            adjacency[spot]
            .length*4;

        if([
            5,8,9,
            12,13,14,
            18,19
        ].includes(spot))
        {
            score+=20;
        }

        if(
            spot===13
        ){
            score+=25;
        }

        if(
            score>
            bestScore
        ){

            bestScore=
                score;

            best=
                spot;
        }
    }

    return best;
}


/* TORCH MODE AI */

function torchMove(){

    const open=
        emptySpaces();

    let best=open[0];
    let bestScore=-999999;

    for(
        const spot
        of open
    ){

        let score=0;

        score +=
            adjacency[spot]
            .length*10;

        for(
            const neighbor
            of adjacency[spot]
        ){

            const n=
                GAME.spaces[
                    neighbor
                ];

            if(
                n.owner===
                "computer"
            ){

                score+=
                    n.number*6;
            }

            if(
                n.owner===
                "player"
            ){

                score-=
                    n.number*4;
            }
        }

        if(
            spot===13
        ){
            score+=35;
        }

        if(
            score>
            bestScore
        ){

            bestScore=
                score;

            best=
                spot;
        }
    }

    return best;
}


/* BROWSER SOUND ENGINE */

function beep(
    frequency,
    duration
){

    const ctx=
    new(
        window.AudioContext ||
        window.webkitAudioContext
    )();

    const osc=
        ctx.createOscillator();

    const gain=
        ctx.createGain();

    osc.connect(gain);

    gain.connect(
        ctx.destination
    );

    osc.frequency.value=
        frequency;

    osc.type="sine";

    gain.gain.setValueAtTime(
        0.08,
        ctx.currentTime
    );

    osc.start();

    osc.stop(
        ctx.currentTime+
        duration/1000
    );
}

function playMoveSound(){

    beep(
        550,
        50
    );
}

function playBlackHoleSound(){

    beep(
        120,
        700
    );
}

function playWinSound(){

    beep(800,150);

    setTimeout(
        ()=>beep(1000,150),
        180
    );

    setTimeout(
        ()=>beep(1300,250),
        360
    );
}

function playLoseSound(){

    beep(300,250);

    setTimeout(
        ()=>beep(170,450),
        200
    );
}

document
.getElementById("musicBtn")
.addEventListener(
    "click",
    ()=>{

        if(
            music.paused
        ){

            music.play()
            .catch(()=>{});

        }
        else{

            music.pause();
        }
    }
);

document
.getElementById("newGame")
.addEventListener(
    "click",
    startGame
);

function finishGame(){

    GAME.gameActive=false;

    const open=
        emptySpaces();

    const blackHole=
        open[0];

    const holeCell=
        GAME.spaces[
            blackHole
        ].cell;

    holeCell.classList.add(
        "blackhole"
    );

    holeCell.textContent="🕳";

    statusText.textContent=
        "BLACK HOLE ACTIVATED!";

    playBlackHoleSound();

    setTimeout(

        ()=>scoreGame(
            blackHole
        ),

        1200

    );
}

function scoreGame(
    blackHole
){

    const destroyed=
        adjacency[
            blackHole
        ];

    let playerScore=0;
    let computerScore=0;

    for(
        let i=1;
        i<=21;
        i++
    ){

        if(
            i===blackHole
        ){
            continue;
        }

        const spot=
            GAME.spaces[i];

        if(
            destroyed.includes(i)
        ){

            spot.cell.classList.add(
                "destroyed"
            );

            continue;
        }

        if(
            spot.owner===
            "player"
        ){

            playerScore+=
                spot.number;
        }

        if(
            spot.owner===
            "computer"
        ){

            computerScore+=
                spot.number;
        }
    }

    GAME.playerScore=
        playerScore;

    GAME.computerScore=
        computerScore;

    animateScore(
        playerScoreSpan,
        playerScore
    );

    animateScore(
        computerScoreSpan,
        computerScore
    );

    setTimeout(()=>{

        if(
            playerScore>
            computerScore
        ){

            result.textContent=
            "🏆 YOU TORCHED THE STORCH! 🏆";

            makeConfetti();

            playWinSound();

        }
        else if(
            computerScore>
            playerScore
        ){

            result.textContent=
            "💀 THE COMPUTER WINS! 💀";

            playLoseSound();
        }
        else{

            result.textContent=
            "🤝 IT'S A TIE! 🤝";
        }

    },1800);
}

function animateScore(
    element,
    end
){

    let current=0;

    element.textContent="0";

    const timer=
        setInterval(()=>{

            current++;

            element.textContent=
                current;

            if(
                current>=end
            ){

                clearInterval(
                    timer
                );
            }

        },20);
}

function makeConfetti(){

    const container=
        document.getElementById(
            "confetti"
        );

    for(
        let i=0;
        i<150;
        i++
    ){

        const piece=
            document.createElement(
                "div"
            );

        piece.className=
            "piece";

        piece.style.left=
            Math.random()*100+
            "vw";

        piece.style.background=
            [
                "red",
                "orange",
                "gold",
                "lime",
                "cyan",
                "blue"
            ][
                Math.floor(
                    Math.random()*6
                )
            ];

        piece.style.animationDelay=
            Math.random()+"s";

        piece.style.width=
            (
                6+
                Math.random()*8
            )+"px";

        piece.style.height=
            piece.style.width;

        container.appendChild(
            piece
        );

        setTimeout(

            ()=>piece.remove(),

            3500

        );
    }
}

music.addEventListener(
    "ended",
    ()=>{
        music.currentTime=0;
    }
);

createBoard();

</script>
</body>
</html>
