<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torch the Storch V3</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

#container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

#banner{
    width:100%;
    max-width:450px;
    border:3px solid orange;
    border-radius:12px;
}

h1{
    margin:15px 0;
}

button{

    padding:12px 20px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}

.rackTitle{

    margin-top:20px;

    font-size:20px;

    font-weight:bold;
}

.rack{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:8px;

    margin:10px 0 20px;
}

.number{

    width:42px;

    height:42px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    font-weight:bold;
}

.playerNumber{

    border:2px solid #29a8ff;

    color:#29a8ff;
}

.computerNumber{

    border:2px solid #ff9800;

    color:#ff9800;
}

#board{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:10px;

    margin-top:20px;
}

.row{

    display:flex;

    gap:10px;
}

.cell{

    width:60px;

    height:60px;

    border-radius:50%;

    border:3px solid orange;

    background:#222;
}

</style>
</head>

<body>

<div id="container">

<img
id="banner"
src="banner.png"
alt="Torch the Storch">

<h1>🔥 TORCH THE STORCH 🔥</h1>

<button id="newGame">

New Game

</button>

<div id="status">

Press New Game

</div>

<div class="rackTitle">

YOUR NUMBERS

</div>

<div
id="playerRack"
class="rack">
</div>

<div class="rackTitle">

COMPUTER NUMBERS

</div>

<div
id="computerRack"
class="rack">
</div>

<div id="board"></div>

<audio
id="music"
src="Torch-the-Storch.mp3">
</audio>

</div>

<script>

let firstGame=true;

const playerRack =
document.getElementById(
    "playerRack"
);

const computerRack =
document.getElementById(
    "computerRack"
);

const board =
document.getElementById(
    "board"
);

const music =
document.getElementById(
    "music"
);

function createRacks(){

    playerRack.innerHTML="";
    computerRack.innerHTML="";

    for(let i=1;i<=10;i++){

        const p=
        document.createElement("div");

        p.className=
        "number playerNumber";

        p.textContent=i;

        playerRack.appendChild(p);

        const c=
        document.createElement("div");

        c.className=
        "number computerNumber";

        c.textContent=i;

        computerRack.appendChild(c);
    }
}

function createBoard(){

    board.innerHTML="";

    const rows=[1,2,3,4,5,6];

    for(let r=0;r<rows.length;r++){

        const row=
        document.createElement("div");

        row.className="row";

        for(let c=0;c<rows[r];c++){

            const cell=
            document.createElement("div");

            cell.className="cell";

            row.appendChild(cell);
        }

        board.appendChild(row);
    }
}

function startGame(){

    createRacks();

    createBoard();

    document
    .getElementById(
        "status"
    ).textContent=
    "Game Started";

    if(firstGame){

        music.play()
        .catch(()=>{});

        firstGame=false;
    }
}
