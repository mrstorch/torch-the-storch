<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torch the Storch</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    color:white;
    background:radial-gradient(circle,#333,#111,#000);
}

#container{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

#banner{
    width:95%;
    max-width:900px;
    border:4px solid orange;
    border-radius:12px;
    margin-bottom:15px;
}

button{
    padding:12px 20px;
    font-size:16px;
    font-weight:bold;
    margin:10px;
    cursor:pointer;
}

#status{
    color:gold;
    font-size:24px;
    margin:15px;
    min-height:30px;
}

#scoreboard{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-bottom:15px;
    font-size:22px;
}

#board{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.row{
    display:flex;
    gap:10px;
}

.cell{
    width:65px;
    height:65px;
    border-radius:50%;
    border:3px solid orange;
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.cell:hover{
    transform:scale(1.05);
}

.player{
    background:#07365a;
    color:#4db8ff;
}

.computer{
    background:#5a2600;
    color:#ffb347;
}

.blackhole{
    background:black;
    color:red;
    border-color:red;
}

.destroyed{
    opacity:.25;
}

#result{
    margin-top:20px;
    font-size:30px;
    font-weight:bold;
}

@media(max-width:700px){

    .cell{
        width:50px;
        height:50px;
        font-size:18px;
    }

    #scoreboard{
        flex-direction:column;
        gap:8px;
    }
}
</style>
</head>

<body>

<div id="container">

<img id="banner" src="banner.png" alt="Torch the Storch">

<h1>🔥 TORCH THE STORCH 🔥</h1>

<button id="newGame">New Game</button>

<div id="status">
Press New Game
</div>

<div id="scoreboard">

<div>
Player Damage:
<span id="playerDamage">0</span>
</div>

<div>
Computer Damage:
<span id="computerDamage">0</span>
</div>

</div>

<div id="board"></div>

<div id="result"></div>

<audio id="music" src="Torch-the-Storch.mp3"></audio>

</div>

<script>

const board = document.getElementById("board");
const statusText = document.getElementById("status");
const resultText = document.getElementById("result");

const playerDamageSpan =
document.getElementById("playerDamage");

const computerDamageSpan =
document.getElementById("computerDamage");

const music =
document.getElementById("music");

const rows = [1,2,3,4,5,6];

let spaces = {};
let currentNumber = 1;
let playerTurn = true;
let gameActive = false;

const adjacency = {
1:[2,3],
2:[1,3,4,5],
3:[1,2,5,6],
4:[2,5,7,8],
5:[2,3,4,6,8,9],
6:[3,5,9,10],
7:[4,8,11,12],
8:[4,5,7,9,12,13],
9:[5,6,8,10,13,14],
10:[6,9,14,15],
11:[7,12,16,17],
12:[7,8,11,13,17,18],
13:[8,9,12,14,18,19],
14:[9,10,13,15,19,20],
15:[10,14,20,21],
16:[11,17],
17:[11,12,16,18],
18:[12,13,17,19],
19:[13,14,18,20],
20:[14,15,19,21],
21:[15,20]
};

function createBoard(){

    board.innerHTML = "";
    spaces = {};

    let id = 1;

    for(let r=0;r<rows.length;r++){

        const row =
        document.createElement("div");

        row.className="row";

        for(let c=0;c<rows[r];c++){

            const cell =
            document.createElement("div");

            cell.className="cell";

            const currentId=id;

            spaces[currentId]={
                owner:null,
                number:null,
                cell:cell
            };

            cell.addEventListener(
                "click",
                ()=>playerMove(currentId)
            );

            row.appendChild(cell);

            id++;
        }

        board.appendChild(row);
    }
}

function startGame(){

    createBoard();

    currentNumber=1;
    playerTurn=true;
    gameActive=true;

    playerDamageSpan.textContent="0";
    computerDamageSpan.textContent="0";

    resultText.textContent="";

    statusText.textContent=
    "Your Turn!";

    music.pause();
    music.currentTime=0;

    music.play().catch(()=>{});
}

function getOpenSpaces(){

    const open=[];

    for(let i=1;i<=21;i++){

        if(!spaces[i].owner){
            open.push(i);
        }
    }

    return open;
}

function playerMove(id){

    if(!gameActive) return;

    if(!playerTurn) return;

    if(spaces[id].owner) return;

    claimSpace(id,"player");
}

function computerMove(){

    const open =
    getOpenSpaces();

    const move =
    open[
        Math.floor(
            Math.random()*open.length
        )
    ];

    claimSpace(move,"computer");
}

function claimSpace(id,owner){

    spaces[id].owner=owner;

    spaces[id].number=currentNumber;

    spaces[id].cell.textContent=
    currentNumber;

    spaces[id].cell.classList.add(owner);

    currentNumber++;

    if(currentNumber>20){

        finishGame();
        return;
    }

    playerTurn=!playerTurn;

    statusText.textContent=
    playerTurn
    ? "Your Turn!"
    : "Computer Thinking...";

    if(!playerTurn){

        setTimeout(
            computerMove,
            800
        );
    }
}

function finishGame(){

    gameActive=false;

    const blackHole =
    getOpenSpaces()[0];

    spaces[blackHole]
    .cell
    .classList
    .add("blackhole");

    spaces[blackHole]
    .cell
    .textContent="🕳";

    const destroyed=
    adjacency[blackHole];

    let playerDamage=0;
    let computerDamage=0;

    destroyed.forEach(id=>{

        const spot=
        spaces[id];

        spot.cell.classList.add(
            "destroyed"
        );

        if(
            spot.owner==="player"
        ){
            playerDamage +=
            spot.number;
        }

        if(
            spot.owner==="computer"
        ){
            computerDamage +=
            spot.number;
        }
    });

    playerDamageSpan.textContent=
    playerDamage;

    computerDamageSpan.textContent=
    computerDamage;

    if(
        playerDamage <
        computerDamage
    ){

        resultText.textContent =
        "🏆 YOU TORCHED THE STORCH!";

    }else if(
        computerDamage <
        playerDamage
    ){

        resultText.textContent =
        "💀 COMPUTER WINS!";

    }else{

        resultText.textContent =
        "🤝 TIE GAME";
    }
}

document
.getElementById("newGame")
.addEventListener(
    "click",
    startGame
);

createBoard();

</script>
</body>
</html>
